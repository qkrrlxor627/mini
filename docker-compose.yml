services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minipay}
      POSTGRES_USER: ${POSTGRES_USER:-minipay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minipay}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
